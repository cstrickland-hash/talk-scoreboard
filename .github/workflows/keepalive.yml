name: Keep Task Desk awake
on:
  schedule:
    # Every 15 minutes, 7:00 AM through 8:45 PM HST (UTC-10)
    - cron: "*/15 17-23,0-6 * * *"
    # 9:00 PM HST
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 90 https://talk-scoreboard.onrender.com/ || true
